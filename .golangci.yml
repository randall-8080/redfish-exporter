run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    # correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosimple
    # style / formatting
    - gofmt
    - goimports
    - misspell
    - whitespace
    - revive
    # additional checks
    - gocritic

linters-settings:
  goimports:
    local-prefixes: github.com/e-breuninger/redfish-exporter

  misspell:
    locale: US


issues:
  exclude-rules:
    # test files often intentionally ignore errors (e.g. t.Cleanup)
    - path: _test\.go
      linters:
        - errcheck
